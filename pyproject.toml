[project]
name = "pl-funnel"
version = "0.4.0"
description = "The feature funnel: idea -> spec -> plan -> your yes -> PR -> review -> merge-ready, driven through the AI coding harness CLIs you already use."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "mcp[ws]>=1.10,<2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
pl = "pl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pl"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout>=2.4.0",
    "pytest-xdist",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test fails after 2 minutes and names itself, instead of holding a run until GitHub's 6-hour job limit.
# The slowest test takes about 7 s on a loaded machine, so 120 s never cuts a healthy one.
timeout = 120
markers = ["e2e: end-to-end tests against real tmux and harness CLIs (skipped unless PL_E2E=1)"]
# Keep only failed tests' tmp_path folders. Kept runs held every test's files, and with many agents
# running the suite at once they filled /tmp's inodes on 2026-10-25.
tmp_path_retention_policy = "failed"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# The legacy script moves verbatim in WP1: it uses `l` as a loop name and `;` in argparse setup.
ignore = ["E702", "E741"]
